name: Supabase keep-alive

# Supabase pauzuje darmowy projekt po 7 dniach bez "wystarczającej" aktywności
# bazodanowej. Jeden request dziennie okazał się poniżej progu (2026-07: mail
# z ostrzeżeniem o pauzie mimo działającego pinga), więc job odpala się co 6h
# i strzela zapytanie do kilku tabel — każde wykonuje realny SQL po stronie bazy.

on:
  schedule:
    # Co 6 godzin.
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # URL i publishable (anon) key są bezpieczne do commitowania.
          # RLS blokuje dostęp do danych; zapytania zwrócą puste tablice,
          # ale każde z nich liczy się jako aktywność bazodanowa.
          for table in suppliers products raw_materials orders components; do
            curl --fail-with-body --silent --show-error \
              "https://vecaqehmgssrihrymcec.supabase.co/rest/v1/${table}?select=id&limit=1" \
              -H "apikey: sb_publishable_-PX3RIoQ4JWttTUcnLTnaA_jC3FGa_4" \
              -H "Authorization: Bearer sb_publishable_-PX3RIoQ4JWttTUcnLTnaA_jC3FGa_4"
            echo " <- ${table}"
          done
